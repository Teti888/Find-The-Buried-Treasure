<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Buried Treasure!</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #fff7df;
            background: #101b20;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --gold: #ffd477;
            --muted: #c4c8b7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            isolation: isolate;
            overflow-x: hidden;
            padding: 48px 20px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(52, 111, 91, .34), transparent 48%),
                radial-gradient(ellipse at 8% 85%, rgba(201, 140, 55, .12), transparent 35%),
                linear-gradient(145deg, #14252a, #101719 62%, #17231d);
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            width: 340px;
            height: 340px;
            border: 1px solid rgba(255, 212, 119, .12);
            border-radius: 50%;
            content: "";
            pointer-events: none;
            animation: drift 16s ease-in-out infinite alternate;
        }

        body::before {
            top: -190px;
            left: -150px;
            box-shadow: 0 0 0 32px rgba(255, 212, 119, .025), 0 0 0 72px rgba(255, 212, 119, .018);
        }

        body::after {
            right: -210px;
            bottom: -220px;
            width: 440px;
            height: 440px;
            animation-delay: -7s;
        }

        .game {
            width: min(100%, 620px);
            text-align: center;
            animation: arrive .8s cubic-bezier(.2, .75, .25, 1) both;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--gold);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .28em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #fff4d5;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.35rem, 8vw, 4.2rem);
            font-weight: 500;
            letter-spacing: -.055em;
            line-height: 1.04;
            text-shadow: 0 4px 30px rgba(255, 194, 91, .16);
        }

        .subtitle {
            margin: 16px 0 30px;
            color: var(--muted);
            font-size: .98rem;
            line-height: 1.6;
        }

        .map-frame {
            position: relative;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid rgba(255, 225, 163, .48);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(255, 249, 223, .2), rgba(91, 67, 39, .3));
            box-shadow:
                0 26px 70px rgba(0, 0, 0, .48),
                0 0 50px rgba(234, 173, 81, .12),
                inset 0 1px 0 rgba(255, 255, 255, .22);
            animation: map-float 5s ease-in-out 1s infinite;
        }

        .map-frame::before {
            position: absolute;
            z-index: -1;
            inset: -18px;
            border: 1px solid rgba(255, 212, 119, .14);
            border-radius: 30px;
            content: "";
            animation: halo 3.2s ease-out infinite;
            pointer-events: none;
        }

        #map {
            display: block;
            width: min(400px, calc(100vw - 64px));
            height: auto;
            aspect-ratio: 1;
            border-radius: 13px;
            cursor: crosshair;
            object-fit: cover;
            transition: filter .25s ease, transform .25s ease;
        }

        #map:hover {
            filter: saturate(1.08) brightness(1.04);
            transform: scale(1.012);
        }

        #distance {
            width: fit-content;
            min-width: 220px;
            min-height: 48px;
            margin: 28px auto 0;
            padding: 13px 22px;
            border: 1px solid rgba(255, 212, 119, .25);
            border-radius: 999px;
            background: rgba(255, 255, 255, .055);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .06);
            color: #ffdfa0;
            font-size: .9rem;
            font-weight: 600;
            letter-spacing: .035em;
            animation: arrive .7s .2s both;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes map-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        @keyframes halo {
            0% { opacity: .7; transform: scale(.98); }
            100% { opacity: 0; transform: scale(1.08); }
        }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(24px, 18px, 0); }
        }

        @media (max-width: 480px) {
            body {
                padding: 36px 16px;
            }

            .subtitle {
                margin-bottom: 25px;
                font-size: .9rem;
            }

            .map-frame {
                padding: 7px;
                border-radius: 17px;
            }

            #map {
                width: min(400px, calc(100vw - 54px));
                border-radius: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="game">
        <p class="eyebrow">A little adventure awaits</p>
        <h1 id="heading">Find the buried treasure</h1>
        <p class="subtitle">Follow the clues, trust your instincts, and see what lies beneath.</p>

        <div class="map-frame">
            <img id="map" width="400" height="400" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6Fr1iGs8IOevEGUPwZy10vUGHPticY7hU0PWPptH_QQ&s">
        </div>

        <p id="distance" aria-live="polite">Click anywhere on the map to begin your search</p>
    </main>

    <script src="https://code.jquery.com/jquery-2.1.0.js"></script>

    <script>
        var getrandomNumber = function(size) {
            return Math.floor(Math.random() * size);
        };

        var getDistance = function(event, target) {
            var map = document.getElementById("map");
            var bounds = map.getBoundingClientRect();
            var mapX = (event.clientX - bounds.left) * width / bounds.width;
            var mapY = (event.clientY - bounds.top) * height / bounds.height;
            var diffX = mapX - target.x;
            var diffY = mapY - target.y;
            return Math.sqrt((diffX * diffX) + (diffY * diffY));
        };

        var getDistanceHint = function(distance) {
            if (distance < 10) {
                return "Boiling hot!";
            } else if (distance < 20) {
                return "Really hot";
            } else if (distance < 40) {
                return "Hot";
            } else if (distance < 80) {
                return "Warm";
            } else if (distance < 160) {
                return "Cold";
            } else if (distance < 320) {
                return "Really cold";
            } else {
                return "Freezing!";
            }
        };

        var width = 400;
        var height = 400;
        var clicks = 0;

        var target = {
            x: getrandomNumber(width),
            y: getrandomNumber(height)
        };

        $("#map").click(function(event) {
            clicks++;

            var distance = getDistance(event, target);
            var distanceHint = getDistanceHint(distance);

            $("#distance").text(distanceHint);

            if (distance < 8) {
                $("#distance").text("You found the treasure in " + clicks + " clicks!");
            }
        });
    </script>

</body>
</html>
